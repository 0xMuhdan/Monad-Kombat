<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monad Kombat // Join Room</title><link rel="stylesheet" href="monad-kombat-theme.css"><style>body{margin:0;background:#101311;color:#f2ead7;font-family:Rajdhani,sans-serif}.join-shell{min-height:100vh;background:radial-gradient(circle at 75% 30%,#d9e85b18,transparent 25%),linear-gradient(135deg,#101311,#202920 58%,#38251e)}.join-top{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #d9e85b66}.join-brand{font-size:27px;font-weight:700;font-style:italic;letter-spacing:4px}.join-brand em{color:#d9e85b;font-style:normal;letter-spacing:7px}.join-status{color:#d9e85b;font-size:11px;letter-spacing:3px}.join-main{width:min(1120px,90%);margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;min-height:calc(100vh - 78px)}.join-copy .kicker{color:#e36f3d;font-weight:700;letter-spacing:4px;font-size:11px}.join-copy h1{font-size:clamp(58px,8vw,110px);line-height:.8;margin:18px 0;letter-spacing:2px;text-shadow:5px 5px #0a0d0a}.join-copy h1 em{color:#d9e85b;font-style:normal}.join-copy p{max-width:410px;color:#a8aa91;font-size:18px;line-height:1.4}.room-console{padding:28px;background:#1b211dea;border:1px solid #a8aa9166;box-shadow:0 20px 55px #0008}.console-label{color:#d9e85b;letter-spacing:3px;font-size:12px;font-weight:700}.room-input{width:100%;margin:18px 0 12px;padding:18px 14px;background:#101613;border:1px solid #a8aa9166;color:#f2ead7;font:700 28px Rajdhani;letter-spacing:8px;text-transform:uppercase}.room-input:focus{border-color:#d9e85b;outline:none;box-shadow:0 0 18px #d9e85b33}.join-button{width:100%;border:1px solid #f2f5be;background:#d9e85b;color:#111511;padding:15px;font:700 18px Rajdhani;letter-spacing:2px;cursor:pointer}.join-button:hover{background:#f2ead7}.back-button{display:inline-block;margin-top:16px;color:#a8aa91;text-decoration:none;font-size:14px;letter-spacing:2px}.back-button:hover{color:#d9e85b}.error{min-height:20px;color:#e36f3d;font-size:13px}.steps{display:grid;gap:8px;margin-top:28px;color:#a8aa91;font-size:13px;letter-spacing:1px}.steps span{border-left:2px solid #d9e85b;padding:8px 12px;background:#252c26}.signal-ring{width:260px;height:260px;border:1px solid #d9e85b66;border-radius:50%;position:absolute;right:12%;top:27%;opacity:.35}.signal-ring:before{content:'';position:absolute;inset:28%;border:1px solid #e36f3d99;border-radius:50%}@media(max-width:750px){.join-main{grid-template-columns:1fr;gap:20px;padding:45px 0}.signal-ring{display:none}.join-copy h1{font-size:70px}}
</style></head><body><div class="join-shell"><header class="join-top"><div class="join-brand">MONAD <em>KOMBAT</em></div><div class="join-status">ROOM ACCESS // MONAD TESTNET</div></header><main class="join-main"><section class="join-copy"><div class="kicker">PRIVATE SIGNAL // INVITATION ONLY</div><h1>JOIN<br><em>THE ROOM</em></h1><p>Enter a six-character room code to synchronize with a squad, choose your side, and lock a unique fighter.</p><div class="steps"><span>01 / ENTER CODE</span><span>02 / CHOOSE SQUAD</span><span>03 / LOCK FIGHTER</span></div></section><section class="room-console"><div class="console-label">ROOM CODE</div><input id="room-code" class="room-input" maxlength="6" placeholder="______" autocomplete="off" autofocus><button id="join" class="join-button">CONNECT TO ROOM ↗</button><div id="error" class="error"></div><a class="back-button" href="monad-kombat.html">← BACK TO STATION</a></section></main><div class="signal-ring"></div></div><script>const input=document.querySelector('#room-code'),error=document.querySelector('#error');input.addEventListener('input',()=>input.value=input.value.replace(/[^a-z0-9]/gi,'').toUpperCase());async function join(){const code=input.value.trim();if(code.length!==6){error.textContent='Room codes contain exactly six characters.';return}const token=localStorage.getItem('blitzbound.session');const api=globalThis.BLITZBOUND_API_URL||'http://localhost:2567';if(!token){location.href='dashboard.html';return}try{const response=await fetch(api+'/api/rooms/'+code,{headers:{Authorization:'Bearer '+token}});if(!response.ok)throw new Error('Room not found or no longer open.');const joinResponse=await fetch(api+'/api/rooms/'+code,{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action:'join'})});if(!joinResponse.ok){const failure=await joinResponse.json().catch(()=>({}));throw new Error(failure.error||'Unable to join room.')}location.href='lobby.html?code='+code}catch(e){error.textContent=e.message)}}document.querySelector('#join').onclick=join;input.addEventListener('keydown',e=>{if(e.key==='Enter')join()});</script></body></html>
