<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monad Kombat // Match Result</title><link rel="stylesheet" href="monad-kombat-theme.css"><style>body{margin:0;background:#101311;color:#f2ead7;font-family:Rajdhani,sans-serif}.result{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#d9e85b18,transparent 25%),linear-gradient(135deg,#101311,#202920 58%,#38251e)}.card{width:min(620px,88%);padding:36px;background:#1b211dea;border:1px solid #d9e85b66;text-align:center;box-shadow:0 20px 60px #0009}.kicker{color:#e36f3d;letter-spacing:4px;font-size:11px;font-weight:700}.card h1{font-size:clamp(58px,10vw,100px);margin:16px 0;color:#d9e85b;letter-spacing:5px}.summary{color:#a8aa91;font-size:16px}.players{display:grid;gap:8px;margin:22px 0;text-align:left}.player{display:flex;justify-content:space-between;padding:10px 14px;background:#252c26;border-left:3px solid #a8aa9166}.player.winner{border-left-color:#d9e85b}.buttons{display:flex;gap:10px}.buttons a{flex:1;padding:13px;background:#d9e85b;color:#111511;text-decoration:none;font-weight:700}.buttons a:last-child{background:#252c26;color:#f2ead7;border:1px solid #a8aa9166}@media(max-width:500px){.buttons{display:grid}.buttons a{width:auto}}</style></head><body><main class="result"><article class="card"><div class="kicker">SIGNAL RESOLVED // MATCH COMPLETE</div><h1 id="title">LOADING</h1><p id="summary" class="summary"></p><button id="retry" style="display:none;border:1px solid #d9e85b;background:#d9e85b;color:#111511;padding:10px 16px;font:700 15px Rajdhani;cursor:pointer">RETRY RESULT</button><section id="players" class="players"></section><a id="monad-explorer-btn" target="_blank" rel="noopener noreferrer" style="display:none;padding:12px;margin:16px 0;background:linear-gradient(135deg,#836ef9,#5035e0);color:#fff;text-decoration:none;font-weight:700;letter-spacing:2px;border:1px solid #a392ff;box-shadow:0 0 16px #836ef955">⚡ VIEW PROOF ON MONAD EXPLORER ↗</a><div class="buttons"><a href="dashboard.html">RETURN TO PROFILE</a><a href="monad-kombat.html">BACK TO STATION</a></div></article></main><script src="fighter-registry.js"></script><script>const code=new URLSearchParams(location.search).get('code');const api=globalThis.BLITZBOUND_API_URL||'http://localhost:2567';async function load(){try{const r=await fetch(api+'/api/results/'+code,{headers:{Authorization:'Bearer '+(localStorage.getItem('blitzbound.session')||'')}});if(!r.ok)throw new Error('Result unavailable');const result=(await r.json()).result;document.querySelector('#title').textContent=result.winner?`TEAM ${result.winner} WINS`:'DRAW';document.querySelector('#summary').textContent=`ROOM ${result.code} · ${new Date(result.savedAt).toLocaleString()}`;document.querySelector('#players').innerHTML=result.players.map(p=>`<div class="player ${p.team===result.winner?'winner':''}"><span>${window.BLITZBOUND_FIGHTERS[p.fighterId]?.name||p.playerId.slice(0,8)} · TEAM ${p.team}</span><b>${p.eliminations||0} K</b></div>`).join('');if(result.txHash){const ex=document.querySelector('#monad-explorer-btn');ex.href='https://testnet.monadexplorer.com/tx/'+result.txHash;ex.style.display='block';}}catch(e){document.querySelector('#title').textContent='RESULT PENDING';document.querySelector('#summary').textContent=e.message;document.querySelector('#retry').style.display='inline-block'}}document.querySelector('#retry').onclick=load;load();</script></body></html>
