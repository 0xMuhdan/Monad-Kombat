<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monad Kombat // Live Combat</title><link rel="stylesheet" href="monad-kombat-theme.css"><style>html,body{margin:0;height:100%;overflow:hidden;background:#050812;color:#eafaff;font-family:Rajdhani,Arial,sans-serif}canvas{width:100%;height:100%;display:block;background:radial-gradient(circle at 50% 20%,#173b6a,#050812 70%)}#hud{position:fixed;inset:20px 28px;display:flex;justify-content:space-between;pointer-events:none;font-weight:700;letter-spacing:2px}.team-a{color:#5cf4e5}.team-b{color:#ff9d54}#status{position:fixed;left:50%;top:24px;transform:translateX(-50%);color:#9bb8cd;font-size:12px;letter-spacing:2px}</style></head><body><canvas id="arena"></canvas><div id="hud"><span class="team-a">TEAM A <b id="a">0</b></span><span class="team-b">TEAM B <b id="b">0</b></span></div><div id="status">CONNECTING TO BOUND CIRCUIT</div><script src="fighter-registry.js"></script><script type="module">import{Client}from'@colyseus/sdk';const api=globalThis.BLITZBOUND_API_URL||'http://localhost:2567',token=localStorage.getItem('blitzbound.session'),playerId=localStorage.getItem('blitzbound.playerId'),params=new URLSearchParams(location.search),code=params.get('code');const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let room,seq=0,state={players:[]},renderPlayers=new Map(),effects=[],atlases=new Map();const atlasPaths=Object.fromEntries(Object.entries(window.BLITZBOUND_FIGHTERS).map(([id,fighter])=>[id,fighter.atlas]));for(const [id,src] of Object.entries(atlasPaths)){const image=new Image();image.src=src;atlases.set(id,image);}function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();async function start(){const response=await fetch(`${api}/api/rooms/${code}`,{headers:{Authorization:'Bearer '+token}});if(!response.ok)throw new Error('Unable to load match room');const r=await response.json();const client=new Client(globalThis.BLITZBOUND_WS_URL||'ws://localhost:2567');client.auth.token=token||'';const startRoster=r.matchRoster||r.room.matchRoster||r.room.players.map(p=>({playerId:p.playerId,username:p.username,team:p.team,fighterId:p.fighterId}));room=await client.joinOrCreate('match',{code,playerId,token,roster:startRoster});room.onMessage('snapshot',s=>{const previous=new Map(state.players.map(p=>[p.playerId,p]));state=s;const alive=s.players.filter(p=>p.connected&&p.hp>0);document.querySelector('#a').textContent=alive.filter(p=>p.team==='A').length;document.querySelector('#b').textContent=alive.filter(p=>p.team==='B').length;for(const p of s.players){const old=previous.get(p.playerId);if(old&&p.hp<old.hp)effects.push({x:p.x,until:performance.now()+260,color:'#ffdf87'});}if(s.phase==='finished'){document.querySelector('#status').textContent=`TEAM ${s.winner} WINS`;setTimeout(()=>location.href='result.html?code='+encodeURIComponent(code),900);}else document.querySelector('#status').textContent='LIVE // SERVER AUTHORITATIVE';});room.onMessage('error',e=>document.querySelector('#status').textContent=e.error);addEventListener('keydown',e=>{if(['ArrowLeft','a','ArrowRight','d'].includes(e.key)){e.preventDefault();room.send('input',{sequence:++seq,left:e.key==='ArrowLeft'||e.key==='a',right:e.key==='ArrowRight'||e.key==='d'})}if(e.key===' '){e.preventDefault();room.send('attack',{sequence:++seq})}if(e.key==='w'){e.preventDefault();room.send('jump',{sequence:++seq})}if(e.key==='i'){e.preventDefault();room.send('special',{sequence:++seq,kind:'skill'})}if(e.key==='p'){e.preventDefault();room.send('special',{sequence:++seq,kind:'ultimate'})}if(e.key==='q'||e.key==='e'){e.preventDefault();room.send('special',{sequence:++seq,kind:'burst'})}});const touchLayer=document.createElement('div');touchLayer.id='online-touch-controls';touchLayer.innerHTML='<button data-input="left">◀</button><button data-input="jump">JUMP</button><button data-input="attack">ATTACK</button><button data-input="skill">SKILL</button><button data-input="right">▶</button>';document.body.append(touchLayer);touchLayer.addEventListener('pointerdown',e=>{const key=e.target.dataset.input;if(!key)return;e.preventDefault();if(key==='attack')room.send('attack',{sequence:++seq});else if(key==='jump')room.send('jump',{sequence:++seq});else if(key==='skill')room.send('special',{sequence:++seq,kind:'skill'});else room.send('input',{sequence:++seq,left:key==='left',right:key==='right'});});requestAnimationFrame(draw)}function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);ctx.strokeStyle='#173b6a';ctx.beginPath();ctx.moveTo(0,innerHeight*.78);ctx.lineTo(innerWidth,innerHeight*.78);ctx.stroke();const now=performance.now();for(const p of state.players||[]){const targetX=p.x/1600*innerWidth;const current=renderPlayers.get(p.playerId)||{x:targetX};current.x+=(targetX-current.x)*.22;renderPlayers.set(p.playerId,current);const x=current.x,y=innerHeight*.78-70;const color=p.team==='A'?'#5cf4e5':'#ff9d54';const atlas=atlases.get(p.fighterId)||atlases.get('vex')||atlases.get('arco');const rows={idle:0,attack:6,hurt:12,down:13};const row=rows[p.animation]??0;const frame=Math.floor(Date.now()/120)%4;ctx.save();ctx.translate(x,y);ctx.scale(p.team==='B'?-1:1,1);ctx.shadowBlur=p.attackFlashUntil>Date.now()?28:18;ctx.shadowColor=color;if(atlas?.complete&&atlas.naturalWidth){ctx.drawImage(atlas,frame*320,row*288,320,288,-96,-288,192,173);}else{ctx.fillStyle=color;ctx.fillRect(-18,-70,36,70);}ctx.restore();ctx.shadowBlur=0;ctx.fillStyle='#edf7ff';ctx.font='12px Rajdhani';ctx.textAlign='center';ctx.fillText(p.username,x,y-80);ctx.fillStyle='#182338';ctx.fillRect(x-28,y-95,56,5);ctx.fillStyle=color;ctx.fillRect(x-28,y-95,56*Math.max(0,p.hp/100),5);if(p.lastHitAt&&Date.now()-p.lastHitAt<260){ctx.strokeStyle='#ffdf87';ctx.lineWidth=3;ctx.strokeRect(x-25,y-77,50,76);}}for(const effect of effects.filter(item=>item.until>now)){ctx.fillStyle=effect.color;ctx.globalAlpha=Math.max(0,(effect.until-now)/260);ctx.beginPath();ctx.arc(effect.x/1600*innerWidth,innerHeight*.78-90,18,0,Math.PI*2);ctx.fill();}effects=effects.filter(item=>item.until>now);ctx.globalAlpha=1;requestAnimationFrame(draw)}start().catch(e=>document.querySelector('#status').textContent=e.message);</script></body></html>
